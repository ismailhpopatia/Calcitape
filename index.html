<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#334155">
  <meta name="description" content="CalciTape - a compact calculator with a running worksheet tape and PDF export.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CalciTape</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
    .subtotal-line {
      border-top: 1px solid #cbd5e1;
      border-bottom: 3px double #475569;
    }
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-200 text-slate-800 h-[100dvh] w-screen overflow-hidden flex flex-col justify-between select-none">

  <!-- Header -->
  <header class="bg-slate-100 border-b border-slate-300 px-3 py-1 flex items-center justify-between shrink-0 h-10">
    <div class="flex items-center gap-2">
      <span class="font-bold text-slate-700 text-sm">☰</span>
      <h1 class="font-semibold text-slate-800 text-sm">CalciTape</h1>
    </div>
    <div class="flex items-center gap-1.5">
      <button id="exportPdfBtn" class="px-2 py-0.5 bg-emerald-700 text-white rounded text-xs font-semibold shadow-sm">📄 PDF</button>
      <button id="clearAllBtn" class="px-2 py-0.5 bg-rose-100 text-rose-700 border border-rose-300 rounded text-xs font-semibold">Clear</button>
    </div>
  </header>

  <!-- Tape Paper Display Area -->
  <main id="paperTape" class="flex-1 bg-slate-50 overflow-y-auto px-2 py-1 space-y-0.5 custom-scroll font-mono-num min-h-0">
  </main>

  <!-- Active Line Control Bar -->
  <div class="bg-slate-200 border-t border-slate-300 px-2 py-1 flex items-center justify-between text-xs text-slate-600 shrink-0">
    <div class="flex items-center gap-1.5 flex-1">
      <span class="bg-slate-300 text-slate-700 font-bold px-1 py-0.2 rounded text-[10px]">K1</span>
      <span class="text-[11px] text-slate-500 font-sans">Remark:</span>
      <input type="text" id="inlineNoteInput" placeholder="type remark..." class="bg-slate-100 border border-slate-300 rounded px-1.5 py-0.5 text-xs text-slate-800 placeholder-slate-400 outline-none flex-1 font-sans focus:border-indigo-500">
    </div>
    <div class="pl-2">
      <button id="copyTotalBtn" title="Copy Total" class="text-slate-600 hover:text-slate-900 text-xs font-bold">📋 Copy</button>
    </div>
  </div>

  <!-- Keypad -->
  <footer class="bg-slate-300 p-1.5 shrink-0 border-t border-slate-300">
    <div class="grid grid-cols-4 gap-1 max-w-md mx-auto">
      
      <!-- Row 1 -->
      <button data-action="ac" class="key-btn bg-amber-700 hover:bg-amber-800 text-white font-bold py-2.5 rounded text-base shadow-sm">AC</button>
      <button data-action="backspace" class="key-btn bg-slate-400/80 hover:bg-slate-400 text-slate-800 font-bold py-2.5 rounded text-base shadow-sm">⌫</button>
      <button data-action="mr" class="key-btn bg-slate-400/80 hover:bg-slate-400 text-slate-800 font-bold py-2.5 rounded text-xs shadow-sm">MR</button>
      <button data-action="custom" class="key-btn bg-slate-300/60 text-slate-600 py-2.5 rounded text-[10px] leading-tight">Customise</button>

      <!-- Row 2 -->
      <button data-action="m-plus" class="key-btn bg-slate-400/80 hover:bg-slate-400 text-slate-800 py-1.5 rounded text-xs font-bold shadow-sm flex flex-col items-center">
        <span>M+</span>
        <span id="mPlusVal" class="text-[8px] text-indigo-700 font-mono-num font-bold">+0.00</span>
      </button>
      <button data-action="m-minus" class="key-btn bg-slate-400/80 hover:bg-slate-400 text-slate-800 py-1.5 rounded text-xs font-bold shadow-sm flex flex-col items-center">
        <span>M-</span>
        <span id="mMinusVal" class="text-[8px] text-rose-700 font-mono-num font-bold">-0.00</span>
      </button>
      <button data-action="mc" class="key-btn bg-slate-400/80 hover:bg-slate-400 text-slate-800 font-bold py-2.5 rounded text-xs shadow-sm">MC</button>
      <button data-op="÷" class="key-btn bg-slate-400/60 text-slate-800 font-bold py-2.5 rounded text-lg shadow-sm">÷</button>

      <!-- Row 3 -->
      <button data-num="7" class="key-btn bg-slate-100 hover:bg-white text-slate-900 font-bold py-2.5 rounded text-lg shadow-sm">7</button>
      <button data-num="8" class="key-btn bg-slate-100 hover:bg-white text-slate-900 font-bold py-2.5 rounded text-lg shadow-sm">8</button>
      <button data-num="9" class="key-btn bg-slate-100 hover:bg-white text-slate-900 font-bold py-2.5 rounded text-lg shadow-sm">9</button>
      <button data-op="×" class="key-btn bg-slate-400/60 text-slate-800 font-bold py-2.5 rounded text-lg shadow-sm">×</button>

      <!-- Row 4 -->
      <button data-num="4" class="key-btn bg-slate-100 hover:bg-white text-slate-900 font-bold py-2.5 rounded text-lg shadow-sm">4</button>
      <button data-num="5" class="key-btn bg-slate-100 hover:bg-white text-slate-900 font-bold py-2.5 rounded text-lg shadow-sm">5</button>
      <button data-num="6" class="key-btn bg-slate-100 hover:bg-white text-slate-900 font-bold py-2.5 rounded text-lg shadow-sm">6</button>
      <button data-op="-" class="key-btn bg-slate-400/60 text-slate-800 font-bold py-2.5 rounded text-lg shadow-sm">-</button>

      <!-- Row 5 -->
      <button data-num="1" class="key-btn bg-slate-100 hover:bg-white text-slate-900 font-bold py-2.5 rounded text-lg shadow-sm">1</button>
      <button data-num="2" class="key-btn bg-slate-100 hover:bg-white text-slate-900 font-bold py-2.5 rounded text-lg shadow-sm">2</button>
      <button data-num="3" class="key-btn bg-slate-100 hover:bg-white text-slate-900 font-bold py-2.5 rounded text-lg shadow-sm">3</button>
      <button data-op="+" class="key-btn bg-slate-400/60 text-slate-800 font-bold py-2.5 rounded text-lg shadow-sm">+</button>

      <!-- Row 6 -->
      <button data-num="0" class="key-btn bg-slate-100 hover:bg-white text-slate-900 font-bold py-2.5 rounded text-lg shadow-sm">0</button>
      <button data-num="." class="key-btn bg-slate-100 hover:bg-white text-slate-900 font-bold py-2.5 rounded text-lg shadow-sm">.</button>
      <button data-action="percent" class="key-btn bg-slate-400/60 text-slate-800 font-bold py-2.5 rounded text-base shadow-sm">%</button>
      <button data-action="equals" class="key-btn bg-slate-400/90 text-slate-900 font-bold py-2.5 rounded text-base shadow-sm flex items-center justify-center">=/↵</button>

    </div>
  </footer>

  <script>
    let tapeItems = [];
    let activeInputString = "";
    let activeOperator = "+";
    let memoryStore = 0; // Fixed Memory State Accumulator

    const paperTape = document.getElementById("paperTape");
    const inlineNoteInput = document.getElementById("inlineNoteInput");
    const mPlusVal = document.getElementById("mPlusVal");
    const mMinusVal = document.getElementById("mMinusVal");

    document.querySelectorAll('.key-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const num = btn.dataset.num;
        const op = btn.dataset.op;
        const action = btn.dataset.action;

        if (num !== undefined) handleNumber(num);
        if (op !== undefined) handleOperator(op);
        if (action !== undefined) handleAction(action);
      });
    });

    window.addEventListener('keydown', (e) => {
      if (document.activeElement === inlineNoteInput) return;

      if (e.key >= '0' && e.key <= '9') handleNumber(e.key);
      else if (e.key === '.') handleNumber('.');
      else if (e.key === '+') handleOperator('+');
      else if (e.key === '-') handleOperator('-');
      else if (e.key === '*') handleOperator('×');
      else if (e.key === '/') { e.preventDefault(); handleOperator('÷'); }
      else if (e.key === 'Enter' || e.key === '=') handleAction('equals');
      else if (e.key === 'Backspace') handleAction('backspace');
      else if (e.key === 'Escape') handleAction('ac');
    });

    inlineNoteInput.addEventListener('input', () => {
      renderTape();
    });

    function handleNumber(digit) {
      if (digit === '.' && activeInputString.includes('.')) return;
      activeInputString += digit;
      renderTape();
    }

    function handleOperator(op) {
      commitActiveLine(op);
    }

    function getActiveOrCurrentTotal() {
      // If typing active input, use that. Otherwise use current grand total.
      const val = parseFloat(activeInputString);
      if (!isNaN(val) && val !== 0) return val;
      const calculated = calculateTape();
      return calculated.length > 0 ? calculated[calculated.length - 1].runningTotal : 0;
    }

    function handleAction(action) {
      if (action === 'ac') {
        tapeItems = [];
        activeInputString = "";
        activeOperator = "+";
        inlineNoteInput.value = "";
        renderTape();
      } else if (action === 'backspace') {
        if (activeInputString.length > 0) {
          activeInputString = activeInputString.slice(0, -1);
          renderTape();
        }
      } else if (action === 'equals') {
        commitActiveLine('SUBTOTAL');
      } else if (action === 'm-plus') {
        // M+ Adds value to memory
        const targetVal = getActiveOrCurrentTotal();
        memoryStore += targetVal;
        updateMemoryDisplay();
      } else if (action === 'm-minus') {
        // M- Subtracts value from memory
        const targetVal = getActiveOrCurrentTotal();
        memoryStore -= targetVal;
        updateMemoryDisplay();
      } else if (action === 'mr') {
        // MR Recalls memory store to active input string
        activeInputString = memoryStore.toString();
        renderTape();
      } else if (action === 'mc') {
        // MC Clears memory store
        memoryStore = 0;
        updateMemoryDisplay();
      }
    }

    function updateMemoryDisplay() {
      mPlusVal.innerText = (memoryStore >= 0 ? "+" : "") + formatNumber(memoryStore);
      mMinusVal.innerText = "-" + formatNumber(Math.abs(memoryStore));
    }

    function commitActiveLine(nextOp) {
      const val = parseFloat(activeInputString) || 0;
      const note = inlineNoteInput.value.trim();

      if (nextOp === 'SUBTOTAL') {
        if (activeInputString !== "") {
          tapeItems.push({
            id: Date.now() + Math.random(),
            type: 'ENTRY',
            operator: activeOperator,
            value: val,
            note: note
          });
        }
        tapeItems.push({
          id: Date.now() + Math.random(),
          type: 'SUBTOTAL',
          operator: '+',
          value: 0,
          note: ''
        });
        activeOperator = "+";
      } else {
        tapeItems.push({
          id: Date.now() + Math.random(),
          type: 'ENTRY',
          operator: activeOperator,
          value: val,
          note: note
        });
        activeOperator = nextOp;
      }

      activeInputString = "";
      inlineNoteInput.value = "";
      renderTape();
    }

    function calculateTape() {
      let runningTotal = 0;
      return tapeItems.map(item => {
        if (item.type === 'ENTRY') {
          if (item.operator === '+') runningTotal += item.value;
          else if (item.operator === '-') runningTotal -= item.value;
          else if (item.operator === '×') runningTotal *= item.value;
          else if (item.operator === '÷') runningTotal = item.value !== 0 ? runningTotal / item.value : 0;
          return { ...item, runningTotal };
        } else {
          return { ...item, runningTotal };
        }
      });
    }

    function renderTape() {
      paperTape.innerHTML = '';
      const calculated = calculateTape();

      calculated.forEach((item) => {
        const row = document.createElement('div');

        if (item.type === 'SUBTOTAL') {
          row.className = "subtotal-line py-0.5 my-1 flex items-center justify-between text-slate-900 font-bold text-sm leading-tight";
          row.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="w-4 text-slate-700 font-bold text-center">+</span>
              <span class="text-slate-900 font-bold">${formatNumber(item.runningTotal)}</span>
            </div>
            <button onclick="deleteLine('${item.id}')" class="text-slate-400 hover:text-rose-600 text-[10px] font-sans">✕</button>
          `;
        } else {
          const isNegative = item.operator === '-' || item.value < 0;
          const numColor = isNegative ? 'text-rose-700' : 'text-slate-900';

          row.className = "flex items-center justify-between py-0 px-1 rounded hover:bg-slate-200/60 group text-sm leading-tight";
          row.innerHTML = `
            <div class="flex items-center gap-2 flex-1 min-w-0">
              <select onchange="updateOperator('${item.id}', this.value)" class="bg-transparent text-slate-700 font-bold outline-none cursor-pointer text-xs">
                <option value="+" ${item.operator === '+' ? 'selected' : ''}>+</option>
                <option value="-" ${item.operator === '-' ? 'selected' : ''}>-</option>
                <option value="×" ${item.operator === '×' ? 'selected' : ''}>×</option>
                <option value="÷" ${item.operator === '÷' ? 'selected' : ''}>÷</option>
              </select>

              <input type="number" step="any" value="${item.value}" onchange="updateValue('${item.id}', this.value)" class="bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 outline-none font-bold ${numColor} w-28 text-left py-0">

              <input type="text" value="${escapeHtml(item.note)}" placeholder="add note..." onchange="updateNote('${item.id}', this.value)" class="bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 outline-none text-slate-400 italic text-xs flex-1 font-sans truncate py-0">
            </div>
            <button onclick="deleteLine('${item.id}')" class="text-slate-300 group-hover:text-rose-600 text-[10px] font-sans ml-1">✕</button>
          `;
        }
        paperTape.appendChild(row);
      });

      // Active Line
      const activeRow = document.createElement('div');
      activeRow.className = "flex items-center gap-2 py-0.5 px-1 text-sm bg-indigo-50/60 border-l-2 border-indigo-500 rounded-r leading-tight";
      const displayVal = activeInputString === "" ? "0" : activeInputString;
      const liveRemark = inlineNoteInput.value.trim();

      activeRow.innerHTML = `
        <span class="w-4 text-indigo-600 font-bold text-center text-xs">${activeOperator}</span>
        <span class="font-bold text-indigo-950 w-28">${displayVal}</span>
        <span class="text-slate-400 italic text-xs font-sans flex-1 truncate">${liveRemark || 'note...'}</span>
      `;
      paperTape.appendChild(activeRow);

      paperTape.scrollTop = paperTape.scrollHeight;
    }

    window.updateOperator = (id, newOp) => {
      const item = tapeItems.find(i => i.id == id);
      if (item) { item.operator = newOp; renderTape(); }
    };

    window.updateValue = (id, newVal) => {
      const item = tapeItems.find(i => i.id == id);
      const parsed = parseFloat(newVal);
      if (item && !isNaN(parsed)) { item.value = parsed; renderTape(); }
    };

    window.updateNote = (id, newNote) => {
      const item = tapeItems.find(i => i.id == id);
      if (item) { item.note = newNote; renderTape(); }
    };

    window.deleteLine = (id) => {
      tapeItems = tapeItems.filter(i => i.id != id);
      renderTape();
    };

    function formatNumber(num) {
      return Number(num).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    document.getElementById('exportPdfBtn').addEventListener('click', () => {
      if (tapeItems.length === 0) { alert("Worksheet is empty!"); return; }
      const calculated = calculateTape();
      const element = document.createElement('div');
      element.className = "p-6 bg-white text-slate-900 font-mono text-xs max-w-xl mx-auto";
      
      let rowsHtml = calculated.map((item) => {
        if (item.type === 'SUBTOTAL') {
          return `
            <tr style="border-top: 1px solid #cbd5e1; border-bottom: 3px double #000; font-weight: bold;">
              <td style="padding: 3px 0;">+</td>
              <td style="padding: 3px 0; font-size: 13px;">${formatNumber(item.runningTotal)}</td>
              <td style="padding: 3px 0; color: #64748b;">SUBTOTAL</td>
            </tr>`;
        } else {
          return `
            <tr style="border-bottom: 1px solid #f8fafc;">
              <td style="padding: 2px 0; font-weight: bold;">${item.operator}</td>
              <td style="padding: 2px 0; font-weight: bold;">${formatNumber(item.value)}</td>
              <td style="padding: 2px 0; color: #64748b; font-style: italic;">${item.note || ''}</td>
            </tr>`;
        }
      }).join('');

      element.innerHTML = `
        <div style="text-align: center; margin-bottom: 16px; border-bottom: 2px solid #000; padding-bottom: 8px;">
          <h2 style="font-size: 18px; font-weight: bold; margin: 0;">CalciTape</h2>
          <p style="font-size: 10px; color: #64748b; margin: 2px 0 0 0;">Date: ${new Date().toLocaleDateString()}</p>
        </div>
        <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
          <thead>
            <tr style="border-bottom: 2px solid #000; text-align: left;">
              <th style="padding-bottom: 4px; width: 30px;">Op</th>
              <th style="padding-bottom: 4px; width: 120px;">Amount</th>
              <th style="padding-bottom: 4px;">Remark / Note</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>`;

      const opt = {
        margin: 0.4,
        filename: `Worksheet_${Date.now()}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      if (confirm("Clear worksheet?")) handleAction('ac');
    });

    renderTape();
    updateMemoryDisplay();
  </script>

  <script>
    // Register the service worker so CalciTape can be opened offline after its first online load.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .catch(error => console.warn('CalciTape service worker registration failed:', error));
      });
    }
  </script>

</body>
</html>
